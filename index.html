<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F4F6F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LegacyQuest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LegacyQuest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--dk:#12082A;--pk:#FF3E9A;--tl:#19C6B7;--yl:#FFD23F;--pu:#5B2AA8;--og:#FF8A2B;--cr:#FFF4E6;--mut:#5A4B78;--pkd:#C4136B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7E0F3;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
.d{font-family:'Bowlby One',sans-serif;font-weight:400}
#app{max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px #12082A22}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--dk);min-height:62px;flex:none}
#back{display:none;width:44px;height:44px;border:2px solid var(--dk);background:#fff;align-items:center;justify-content:center;flex:none}
#back.on{display:flex}
#av{width:44px;height:44px;background:var(--tl);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
#av.off{display:none}
.ttl{flex:1;min-width:0}
.ttl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--mut)}
.ttl b{font-size:20px;line-height:1.1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:15px}
.chip.y{background:var(--yl)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 14px;-webkit-overflow-scrolling:touch}
.screen{display:none}
.screen.on{display:block;animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
nav{display:flex;border-top:2px solid var(--dk);background:#fff;flex:none;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5A4B78;font-weight:700;font-size:11px}
nav button.on{color:var(--pkd)}
nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:4px;background:var(--pk)}
nav button{position:relative}
.ic{display:block;overflow:visible}
/* panels */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.p{padding:12px;position:relative;overflow:hidden;border:0;text-align:left;width:100%}
.lbl{font-weight:700;font-size:11px;letter-spacing:.16em}
.pk{background:var(--pk)}.tl{background:var(--tl)}.yl{background:var(--yl)}.pu{background:var(--pu);color:#fff}.og{background:var(--og)}.cr{background:var(--cr)}.dk{background:var(--dk);color:#fff}
.c3{grid-column:1/4}.c2{grid-column:1/3}
.btn{min-height:52px;width:100%;border:0;background:var(--dk);color:var(--pk);font-family:'Bowlby One',sans-serif;font-size:19px;letter-spacing:.04em;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:#4A3A78;color:#E7DDF8;cursor:not-allowed}
.btn.pk{background:var(--pk);color:var(--ink)}
#lgGo{background:var(--og);color:var(--ink)}
#s-login .mas{margin:0 auto}
.btn.sm{min-height:44px;font-size:14px;padding:0 16px;width:auto}
.bar{height:12px;background:#fff;border:2px solid var(--dk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dk);width:0;transition:width .6s cubic-bezier(.2,.9,.3,1);background-image:linear-gradient(100deg,transparent 30%,#ffffff55 50%,transparent 70%);background-size:200% 100%;animation:shine 2.6s linear infinite}
.bar.l>i{background-color:var(--pk)}
@keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
h2{margin:14px 2px 8px;font-family:'Bowlby One',sans-serif;font-weight:400;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;min-height:46px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:15px}
.tabs button.on{background:var(--dk);color:#fff}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border:2px solid var(--dk);background:#fff;margin-bottom:6px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t span{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.xpb{background:var(--yl);padding:2px 8px;font-weight:700;font-size:13px;border:2px solid var(--dk)}
.sq{width:46px;height:46px;border:2px solid var(--dk);background:var(--pk);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s}
.sq:active{transform:scale(.9) rotate(-6deg)}
.sq[disabled]{background:#E4DDF0;cursor:default}
.ib{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.chk{width:26px;height:26px;border:2.5px solid var(--dk);flex:none;display:flex;align-items:center;justify-content:center;background:transparent}
.chk.on{background:var(--dk);color:#fff}
.chk.on svg{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.dr{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;border:0;background:transparent;text-align:left;font-weight:700;font-size:16px;padding:0}
.dr .n{flex:1}
.dr .st{font-size:11px;letter-spacing:.1em}
/* tile */
.tile{min-height:92px;display:flex;flex-direction:column;justify-content:space-between;border:0;padding:10px;text-align:left;width:100%;font-weight:700}
.tile:active{transform:scale(.97)}
/* modal & toast */
#toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,20px);background:var(--dk);color:#fff;padding:12px 18px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:#12082Acc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
#mbox{background:#fff;border:3px solid var(--dk);width:100%;max-width:360px;padding:18px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:90%;overflow:auto}
input,select{width:100%;min-height:48px;border:2px solid var(--dk);padding:0 12px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}

/* town hall */
.hall{position:relative;overflow:hidden;border:0;padding:14px 12px 16px;text-align:center}
.hall.k1{background:var(--yl);padding-top:18px}
.rays{position:absolute;left:50%;top:44%;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 10deg,rgba(255,255,255,0) 10deg 20deg);animation:spinI 26s linear infinite;pointer-events:none}
.ghost{position:absolute;font-family:'Bowlby One',sans-serif;line-height:.8;color:rgba(18,8,42,.1);pointer-events:none}
.phW{position:relative;display:inline-block;z-index:2}
.phW .fr{background:#fff;border:3px solid var(--dk);padding:4px;box-shadow:4px 4px 0 var(--dk)}
.phW img,.phW svg{display:block}
.k1 .phW{animation:float 3s ease-in-out infinite}
.k1 .phW .fr{transform:rotate(-3deg)}
.crown{position:absolute;left:50%;top:-26px;margin-left:-22px;z-index:3;animation:float 2.2s ease-in-out infinite}
.medal{position:absolute;right:-12px;bottom:-12px;z-index:3;width:34px;height:34px;background:var(--dk);color:var(--yl);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-family:'Bowlby One',sans-serif;font-size:16px}
.hall .nm{position:relative;z-index:2;margin-top:12px}
.hallrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.rise{animation:rise .6s cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sp{position:absolute;color:var(--ink);animation:twk 1.6s ease-in-out infinite;z-index:1}
@keyframes twk{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
.rowav{flex:none;border:2px solid var(--dk);display:block}

/* vault */
.vstage{position:relative;height:330px;background:var(--dk);overflow:hidden;isolation:isolate}
.vstage .tag{position:absolute;left:0;top:0;background:var(--tl);color:var(--ink);font-weight:700;font-size:11px;letter-spacing:.16em;padding:5px 10px;z-index:8}
.vstage .dots{position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1.2px,transparent 1.4px);background-size:22px 22px}
.vfl{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
.vfl.go{animation:vfl .6s ease-out}
@keyframes vfl{0%{opacity:.9}100%{opacity:0}}
.vW{position:absolute;left:50%;top:50%;width:236px;height:236px;margin:-112px 0 0 -118px;perspective:900px;z-index:3}
.vW.idle{animation:float 3.2s ease-in-out infinite}
.vIn{position:absolute;inset:0;background:#0b0518;border:6px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);transition:box-shadow .6s}
.vIn.rare{background:var(--pk)}.vIn.epic{background:#9B6BFF}.vIn.legend{background:var(--yl)}
.vIn.lit{box-shadow:0 0 70px var(--rc),0 0 20px #fff}
.vIn.rare{--rc:var(--pk)}.vIn.epic{--rc:#9B6BFF}.vIn.legend{--rc:var(--yl)}
.vDoor{position:absolute;inset:0;background:var(--tl);border:6px solid #fff;transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.5,0,.2,1);transform-style:preserve-3d}
.vDoor.open{transform:rotateY(-112deg)}
.vDoor.click{animation:vclk .12s}
@keyframes vclk{50%{transform:translateX(3px)}}
.vRing{position:absolute;inset:16px;border:4px solid var(--dk)}
.dial{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:repeating-conic-gradient(#fff 0 2.2deg,#12082A 2.2deg 12deg);border:4px solid var(--dk)}
.dial::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--dk)}
.dial i{position:absolute;left:50%;top:6px;width:10px;height:22px;margin-left:-5px;background:var(--pk);z-index:2}
.ptr{position:absolute;left:50%;top:50%;margin:-80px 0 0 -9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--yl);z-index:3}
.hdl{position:absolute;right:18px;top:50%;width:14px;height:80px;margin-top:-40px;background:#fff;border:3px solid var(--dk);transition:transform .5s}
.hdl.turn{transform:rotate(90deg)}
.bt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--dk);transition:transform .5s}
.bt.a{left:6px;top:6px}.bt.b{left:6px;bottom:6px}.bt.c{right:6px;top:6px}.bt.d{right:6px;bottom:6px}
.vDoor.open .bt{transform:scale(0)}
.vstars{display:flex;gap:2px;justify-content:center}
.vstars span{animation:pop .5s cubic-bezier(.2,1.8,.4,1) backwards}
.vlock{position:absolute;inset:0;background:#12082Af2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.vlock .ch{display:flex;gap:6px}.vlock .ch i{width:52px;height:8px;background:#4A3A78}.vlock .ch i.on{background:var(--tl)}
.vlock b{font-size:13px;letter-spacing:.06em}.vlock p{margin:0;font-size:13px;font-weight:600;color:#D9CCF3;max-width:260px}
.vlock svg{animation:wig 3s infinite}

/* koleksi */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kcard{border:2px solid var(--dk);background:#fff;padding:10px;text-align:center;position:relative;min-height:44px}
.kcard.on{outline:4px solid var(--pk)}
.kcard .rb{position:absolute;left:0;top:0;font-weight:700;font-size:10px;letter-spacing:.12em;padding:2px 6px;color:var(--ink)}
.kcard b{display:block;font-size:14px;margin-top:8px}
.kcard small{display:block;font-weight:700;font-size:11px;color:var(--mut)}
.kcard button{margin-top:6px;width:100%;min-height:40px;border:2px solid var(--dk);background:var(--pk);font-weight:700;font-size:13px}
.kt{display:flex;gap:4px;margin:6px 0}.kt button{flex:1;min-height:44px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:12px;padding:0 2px}.kt button.on{background:var(--dk);color:#fff}
.chp{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chp button{min-height:44px;padding:0 12px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:13px}.chp button.on{background:var(--yl)}
.chp button.sw{width:44px;padding:0}
.leadtabs{display:grid!important;grid-template-columns:repeat(2,1fr);gap:6px;overflow:visible!important}.leadtabs button{width:100%;padding:0 4px;white-space:nowrap}
.lh{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--mut);margin:14px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lg2 button,.lg4 button{min-height:46px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:13px;padding:4px 6px;line-height:1.2}.lg2 button.on,.lg4 button.on{background:var(--yl);box-shadow:3px 3px 0 var(--dk)}
.lg2 button small{display:block;font-weight:600;font-size:11px;color:var(--mut)}
img.mas{}
.kcard.lk{background:#EDE6F7}.kcard.lk .fw{filter:grayscale(1) brightness(.75);opacity:.7}
.fw{position:relative;display:inline-block;padding:5px}
.fw .dec{position:absolute;pointer-events:none}
.fw.f-pantai{background:linear-gradient(#19C6B7 55%,#FFD23F 55%);border:3px solid var(--dk)}
.fw.f-palem{background:repeating-linear-gradient(45deg,#19C6B7 0 8px,#0E9487 8px 16px);border:3px solid var(--dk)}
.fw.f-neon{background:#FF3E9A;border:3px solid #fff;box-shadow:0 0 0 3px var(--dk),0 0 18px 4px #FF3E9A}
.fw.f-teal{background:radial-gradient(#fff 1px,transparent 1.4px) 0 0/10px 10px,#0B3B45;border:3px solid #19C6B7;box-shadow:0 0 0 3px var(--dk)}
.fw.f-sunset{background:linear-gradient(135deg,#5B2AA8,#FF3E9A 45%,#FF8A2B 75%,#FFD23F);border:3px solid var(--dk);box-shadow:0 0 0 3px #FFD23F}
.fw.f-pixel{background:conic-gradient(#19C6B7 25%,#FFD23F 0 50%,#FF3E9A 0 75%,#9B6BFF 0) 0 0/12px 12px;border:3px solid var(--dk)}
.fw.f-api{background:linear-gradient(0deg,#FF8A2B,#FF3E9A 60%,#FFD23F);border:3px solid var(--dk);box-shadow:0 0 0 3px #FF8A2B}
.fw.f-crown{background:linear-gradient(135deg,#FFD23F,#FFF4B0 40%,#FFD23F 60%,#E0A800);border:3px solid var(--dk);box-shadow:0 0 0 3px #fff,0 0 20px 3px #FFD23F;animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.18)}}
.fw .in{display:block;border:2px solid var(--dk);background:#fff;line-height:0}
.k1 .phW .fr{background:transparent;border:0;padding:0;box-shadow:none}
.k1 .phW .fw{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{min-height:44px;padding:0 12px;border:2px solid var(--dk);background:var(--cr);font-weight:700;font-size:14px}
#modal textarea{width:100%;border:2px solid var(--dk);padding:10px 12px;font:inherit;font-size:16px;background:#fff}
button.nrow{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tag{padding:4px 10px;border:2px solid var(--dk);font-weight:700;font-size:12px;white-space:nowrap}
/* mascot */
.mas{display:block;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.mas.jump{animation:jump .6s ease-out}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-2deg)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
.bubble{position:absolute;right:8px;top:8px;background:#fff;color:var(--ink);padding:8px 10px;font-weight:700;font-size:13px;max-width:120px;line-height:1.25;border:2px solid var(--dk)}
/* icon animations */
.wig{animation:wig 3.6s infinite;transform-origin:50% 50%}
@keyframes wig{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-16deg)}92%{transform:rotate(14deg)}95%{transform:rotate(-8deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(1.08,1.15) skewX(-4deg)}60%{transform:scale(.95,1.05) skewX(3deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
nav button.on .ic{animation:navp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes navp{0%{transform:translateY(8px) scale(.7) rotate(-14deg)}100%{transform:none}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.spinI{animation:spinI 6s linear infinite}
@keyframes spinI{to{transform:rotate(360deg)}}
.numpop{animation:numpop .4s ease-out}
@keyframes numpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.shake{animation:shake .12s linear 12}
@keyframes shake{0%{transform:translateX(-4px) rotate(-2deg)}50%{transform:translateX(4px) rotate(2deg)}100%{transform:translateX(-4px) rotate(-2deg)}}
.cap{animation:capin .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes capin{0%{transform:translateY(-60px) scale(.3) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
.cf{position:absolute;width:9px;height:14px;top:-20px;z-index:40;animation:fall 1.5s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),780px) rotate(720deg);opacity:.9}}
/* misc */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal b{font-size:11px;text-align:center;color:var(--mut)}
.day{min-height:42px;border:2px solid transparent;font-weight:700;font-size:13px;background:#F1ECF8;display:flex;align-items:center;justify-content:center}
.day.sel{border-color:var(--ink)}
.day.in{outline:3px solid var(--yl);outline-offset:-3px}
.day.off{background:transparent;border:0;cursor:default}
.tag{display:inline-block;padding:2px 8px;font-weight:700;font-size:12px;border:2px solid var(--dk)}
.flex .lbl{letter-spacing:.06em;font-size:10px}
.flex{background:var(--dk);color:#fff;padding:14px;position:relative;overflow:hidden;margin:0 auto;transition:all .3s}
.note{font-size:12px;font-weight:600;color:var(--mut);margin:6px 2px}
.pre{background:var(--cr);border:2px dashed var(--dk);padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.cc{display:inline-block;margin:0 6px 6px 0;min-height:44px;padding:0 14px;border:2px solid var(--dk);background:#fff;font-weight:700;font-size:14px}
.cc.on{background:var(--pk)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<style>

/* ===== v20: liquid glass (A3) + tema ===== */
:root{--ink:#1D2A33;--bgA:#F4F6F8;--bgB:#DDE1E8;--bgC:#C9CFD9;--pkr:255,138,43;--tlr:25,198,183;--ylr:255,199,44;--ogr:242,107,29;--pur:22,52,62;--dkr:22,52,62;
 --g1:rgba(255,255,255,.82);--g2:rgba(255,255,255,.3);--rimc:#fff;--edge:rgba(120,135,155,.32);--shd:rgba(50,62,82,.36);--glw:rgba(255,255,255,.6)}
html[data-dk="1"]{--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--rimc:rgba(255,255,255,.3);--edge:rgba(255,255,255,.1);--shd:rgba(0,0,0,.5);--glw:rgba(255,255,255,.12)}
html,body{background:radial-gradient(120% 60% at 20% 0%,var(--bgA) 0%,var(--bgB) 55%,var(--bgC) 100%) fixed;font-family:Inter,Outfit,system-ui,sans-serif;color:var(--ink)}
.d,h2,.btn{font-family:'Archivo Black',Inter,sans-serif!important;font-weight:400}
#app{background:radial-gradient(120% 60% at 20% 0%,var(--bgA) 0%,var(--bgB) 55%,var(--bgC) 100%);box-shadow:0 0 40px rgba(0,0,0,.18)}
header,nav{background:var(--g1)!important;border:0!important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
header{border-bottom:1.5px solid var(--rimc)!important;box-shadow:0 8px 14px -12px var(--shd)}
nav{border-top:1.5px solid var(--rimc)!important;box-shadow:0 -8px 14px -12px var(--shd)}
nav button{background:transparent!important;color:var(--mut)}
nav button.on{color:var(--pkd)}
nav button.on::before{height:4px;border-radius:0 0 4px 4px;background:var(--pk)}
.ttl small{color:var(--mut)}
/* kaca */
.p,.row,.kcard,.chip,.cc,.tabs button,.kt button,.chp button,.lg2 button,.lg4 button,#back,.day,.tile,.tag,.xpb,.flex,.pre,.bubble,#mbox,input,select,#modal textarea,.sq,.chk,.ib,.fw .in{
 border:2px solid var(--rimc)!important;border-radius:20px;box-shadow:0 0 0 1px var(--edge),0 14px 18px -12px var(--shd);color:var(--ink)}
.p,.row,.kcard,.tile,.flex{background:linear-gradient(160deg,var(--g1),var(--g2) 60%,rgba(var(--pkr),.1))!important;backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.p.pk,.tile.pk{background:linear-gradient(160deg,var(--g1),var(--g2) 52%,rgba(var(--pkr),.42))!important}
.p.tl,.tile.tl{background:linear-gradient(160deg,var(--g1),var(--g2) 52%,rgba(var(--tlr),.42))!important}
.p.yl,.tile.yl{background:linear-gradient(160deg,var(--g1),var(--g2) 52%,rgba(var(--ylr),.5))!important}
.p.og,.tile.og{background:linear-gradient(160deg,var(--g1),var(--g2) 52%,rgba(var(--ogr),.4))!important}
.p.cr{background:linear-gradient(160deg,var(--g1),var(--g2))!important}
.p.pu,.p.dk{background:linear-gradient(160deg,rgba(var(--pur),.94),rgba(var(--pur),.8))!important;color:#fff!important;border-color:rgba(255,255,255,.55)!important}
.p.pu .lbl,.p.dk .lbl,.p.pu .note,.p.dk .note{color:#D6E4EA}
.hall,.hall.k1{background:linear-gradient(160deg,var(--g1),var(--g2) 55%,rgba(var(--ylr),.5))!important}
.hall.k1 .rays{opacity:.5}
.row,.chip,.cc,.tabs button,.kt button,.chp button,.lg2 button,.lg4 button,#back,.day,.tag,.xpb,.pre,.bubble,input,select,#modal textarea,.sq,.ib{background:var(--glw)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.row,.chip,.cc,.tabs button,.kt button,.chp button,.lg2 button,.lg4 button,#back,.day,.tile,.tag,.xpb,.pre,.sq{border-radius:16px}
.bubble{border-radius:18px;color:var(--ink)}
input,select,#modal textarea{border-radius:14px;background:var(--glw)!important;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
html[data-dk="1"] option{color:#111}
.tabs button.on,.kt button.on,.chp button.on,.lg2 button.on,.lg4 button.on,.cc.on,.day.sel,.chp button.sw.on{background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 72%,#fff),var(--pk))!important;color:#fff!important;box-shadow:0 0 0 1px var(--edge),0 10px 14px -8px rgba(var(--pkr),.7)}
.chp button.sw.on{outline:3px solid var(--pk);outline-offset:2px}
.chp button.sw{border-radius:50%}
.day.in{outline:3px solid var(--yl);outline-offset:-3px}
.day.off{background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none}
/* tombol utama */
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 72%,#fff),var(--pk))!important;color:#fff!important;border:2px solid #fff!important;border-radius:999px!important;box-shadow:0 0 0 1px var(--edge),0 14px 18px -8px rgba(var(--pkr),.75);text-shadow:0 1px 0 rgba(0,0,0,.18)}
#lgGo,.btn.pk{background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 72%,#fff),var(--pk))!important;color:#fff!important}
.btn[style*="background:#fff"],.btn[style*="background: #fff"]{background:var(--glw)!important;color:var(--ink)!important;text-shadow:none;box-shadow:0 0 0 1px var(--edge),0 10px 14px -10px var(--shd);border:2px solid var(--rimc)!important}
.btn[disabled]{background:var(--glw)!important;color:var(--mut)!important;box-shadow:0 0 0 1px var(--edge);text-shadow:none;opacity:.85}
.kcard button{background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 72%,#fff),var(--pk))!important;color:#fff!important;border:2px solid #fff!important;border-radius:999px}
.kcard.on{outline:3px solid var(--pk);outline-offset:2px}
.kcard .rb{border-radius:12px 0 12px 0;color:#fff!important}
.kcard.lk{background:var(--glw)!important}
/* bar & centang */
.bar{border:0!important;border-radius:99px;background:var(--glw);box-shadow:inset 0 0 0 1.5px var(--edge)}
.bar>i{background-color:var(--tl)!important;border-radius:99px}
.bar.l>i{background-color:var(--tl)!important}
.chk{border-radius:9px;background:var(--glw)!important;width:28px;height:28px}
.chk.on{background:linear-gradient(180deg,color-mix(in srgb,var(--tl) 70%,#fff),var(--tl))!important;color:#fff!important}
.rowav{border:2px solid var(--rimc)!important}
.sq{background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 72%,#fff),var(--pk))!important;color:#fff}
.sq[disabled]{background:var(--glw)!important}
.xpb{background:rgba(var(--ylr),.7)!important;color:#1D2A33}
/* modal & toast */
#modal{background:rgba(18,28,36,.5)!important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#mbox{background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(240,244,248,.9))!important;border-radius:26px;color:#1D2A33}
html[data-dk="1"] #mbox{background:linear-gradient(160deg,rgba(40,48,66,.97),rgba(24,30,46,.95))!important;color:#fff}
#mbox input,#mbox textarea,#mbox select{color:inherit}
#toast{background:rgba(22,34,42,.9)!important;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;backdrop-filter:blur(10px)}
#sync{background:rgba(22,34,42,.9)!important;border-radius:999px;border:1.5px solid rgba(255,255,255,.5)!important}
/* avatar header */
#av{background:var(--glw)!important;border-radius:50%;overflow:hidden;border:2px solid var(--rimc);box-shadow:0 0 0 1px var(--edge)}
.fw{box-shadow:0 0 0 1px var(--edge),0 8px 12px -6px var(--shd)!important}
.phW .fr{border:0!important;box-shadow:none!important;background:transparent!important}
.note,.lh{color:var(--mut)}
.lbl{color:inherit;opacity:.85}
.pre{background:var(--glw)!important}
.cal b{color:var(--mut)}
.row .t span{color:var(--mut)}
/* gelap */
html[data-dk="1"] .p.pk,html[data-dk="1"] .p.tl,html[data-dk="1"] .p.yl,html[data-dk="1"] .p.og,html[data-dk="1"] .tile{color:#fff}
html[data-dk="1"] .p.yl .lbl,html[data-dk="1"] .p.yl{color:#fff}
html[data-dk="1"] .xpb,html[data-dk="1"] .chip.y{color:#1D2A33}
html[data-dk="1"] input,html[data-dk="1"] select,html[data-dk="1"] textarea{color:#fff}
html[data-dk="1"] .btn[style*="background:#fff"]{color:#fff!important}
html[data-dk="1"] .fw .in{background:#fff}
.thm{min-height:88px;text-align:left}.thm.on{outline:3px solid var(--pk);outline-offset:2px}.sw5{display:flex;height:26px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(0,0,0,.14)}
.nbox{border-radius:16px;padding:10px 12px;background:var(--glw);box-shadow:0 0 0 1px var(--edge)}.nbox.y{background:rgba(var(--ylr),.4)}
.vstage{border-radius:24px;border:2px solid var(--rimc);box-shadow:0 0 0 1px var(--edge),0 18px 24px -12px var(--shd)}
.bubble{right:8px;top:auto;bottom:156px;max-width:112px;font-size:12.5px;padding:7px 10px}
#pMas .lbl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid>*,.row>.t,.p{min-width:0}
.ttl b,.ttl small{max-width:100%}
@media (max-width:380px){.chip{padding:0 8px;font-size:14px;gap:4px}header{gap:6px;padding:8px 8px}main{padding:8px 8px 14px}.d{word-break:break-word}h2{font-size:16px}.btn{font-size:16px}.tabs button,.kt button{font-size:13px}.apg{gap:6px}.lg4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:340px){.chip{padding:0 6px;font-size:13px}.grid{gap:5px}.p{padding:10px}.tile{font-size:13px}.btn{font-size:14px}}
input.rng{padding:0;border:0!important;box-shadow:none!important;background:transparent!important;min-height:36px;accent-color:var(--pk)}
.mas{filter:drop-shadow(0 8px 6px rgba(30,40,60,.25))}
[data-dk="1"] .mas{filter:drop-shadow(0 0 6px rgba(255,255,255,.35)) drop-shadow(0 8px 6px rgba(30,40,60,.3))}
.phW img,.fw .in img{border-radius:50%}
.vstage{background:linear-gradient(160deg,var(--dk),color-mix(in srgb,var(--dk) 65%,#000))}
.vIn{background:var(--dk)}.vIn.rare{background:var(--pk)}.vIn.epic{background:var(--tl);--rc:var(--tl)}.vIn.legend{background:var(--yl)}
.vlock{background:rgba(var(--dkr),.94)}.vlock .ch i{background:rgba(255,255,255,.25)}
.dial{background:repeating-conic-gradient(#fff 0 2.2deg,var(--dk) 2.2deg 12deg)}.dial::after{background:var(--dk)}.dial,.vRing,.hdl{border-color:var(--dk)}
.vstage .tag{background:var(--tl);color:#fff;border-radius:0 0 12px 0}
.vlock p{color:#D6E4EA}
input,select,textarea{min-width:0;max-width:100%}.row input{min-width:0}
[style*="flex:1"]{min-width:0}
.apg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 10px}.apre{padding:0;border:0;background:none;border-radius:50%;min-height:44px;line-height:0;box-shadow:0 0 0 2px #fff,0 5px 8px -4px rgba(30,40,60,.45)}.apre svg{width:100%;height:auto}.apre.on{box-shadow:0 0 0 3px var(--og),0 0 0 5px #fff}
.fw,.fw .in,.phW .fr{border-radius:50%}.rowav{border-radius:50%}
body.wait{cursor:progress}
#sync{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;background:var(--dk);color:#fff;border:2px solid var(--dk);padding:3px 10px 3px 6px;font:700 11px Outfit,system-ui,sans-serif;letter-spacing:.08em;box-shadow:3px 3px 0 var(--yl);pointer-events:none}
body.wait #sync{display:flex}
#sync i{width:14px;height:14px;border:3px solid var(--yl);border-top-color:transparent;border-radius:50%;animation:spn .7s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#app.nolog header,#app.nolog #nav{display:none}
input:focus,textarea:focus{outline:3px solid var(--yl)}
button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--dk);padding:8px 10px;margin-bottom:6px}
</style>

function toast(t){const e=Q("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1900)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

(function(){const m=Q("#modal"),vv=window.visualViewport;

function call(action,payload){
  return new Promise(res=>{
    if(!GAS){
      if(!API_URL){res({error:"Tidak terhubung ke server"});return}
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),40000);
      fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify([action,TOK,payload||{}]),signal:ac.signal})
        .then(r=>r.json()).then(r=>{clearTimeout(tm);res(r||{error:"Tidak ada jawaban dari server"})})
        .catch(()=>{clearTimeout(tm);res({error:"Tidak bisa terhubung. Cek internet lalu coba lagi."})});
      return}
    google.script.run.withSuccessHandler(r=>res(r||{error:"Tidak ada jawaban dari server"})).withFailureHandler(e=>res({error:(e&&e.message)||String(e)})).api(action,TOK,payload||{});
  });
}

async function doAct(action,payload,quiet){
  pend++;document.body.classList.add("wait");
  const r=await call(action,payload);pend--;if(!pend)document.body.classList.remove("wait");
  if(r.error){if(r.login){TOK=null;try{localStorage.removeItem("lqp_tok");localStorage.removeItem("lqp_cache")}catch(e){}D=null;showLogin();return null}
    if(!quiet)toast(r.error);return {error:r.error}}

}

function photoPicked(f){
  if(!f)return;if(!/^image\//.test(f.type)){toast("Pilih file gambar ya");return}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>cropUI(im);im.onerror=()=>toast("Foto tidak bisa dibuka");im.src=rd.result};rd.readAsDataURL(f)}
function cropUI(im){
  const V=280,base=Math.max(V/im.width,V/im.height);let z=1,sc=base,x=(V-im.width*sc)/2,y=(V-im.height*sc)/2;
  modal(`<div class="d" style="font-size:20px">Atur foto</div><div class="note" style="margin:2px 0 0">Geser foto sampai wajahmu di tengah lingkaran. Pakai slider untuk zoom.</div><div id="crW" style="position:relative;width:${V}px;max-width:100%;height:${V}px;margin:10px auto;overflow:hidden;border-radius:22px;touch-action:none;background:#111"><canvas id="crC" width="${V}" height="${V}" style="display:block;width:100%;height:100%"></canvas><div style="position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.5),inset 0 0 0 2px #fff"></div></div><input type="range" id="crZ" min="100" max="400" value="100" aria-label="Zoom" class="rng"><div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm" id="mNo" style="flex:1;background:#fff">Batal</button><button class="btn sm pk" id="mYes" style="flex:1">Pakai foto</button></div>`);
  const cv=Q("#crC"),cx=cv.getContext("2d"),W=Q("#crW");
  const clamp=()=>{x=Math.min(0,Math.max(V-im.width*sc,x));y=Math.min(0,Math.max(V-im.height*sc,y))};
  const draw=()=>{clamp();cx.fillStyle="#111";cx.fillRect(0,0,V,V);cx.drawImage(im,x,y,im.width*sc,im.height*sc)};draw();
  let dr=null;
  W.addEventListener("pointerdown",e=>{dr={px:e.clientX,py:e.clientY,x,y};try{W.setPointerCapture(e.pointerId)}catch(_){}});
  W.addEventListener("pointermove",e=>{if(!dr)return;const k=V/W.getBoundingClientRect().width;x=dr.x+(e.clientX-dr.px)*k;y=dr.y+(e.clientY-dr.py)*k;draw()});
  const up=()=>{dr=null};W.addEventListener("pointerup",up);W.addEventListener("pointercancel",up);
  Q("#crZ").addEventListener("input",e=>{const n=+e.target.value/100,o=sc,ns=base*n,mx=(V/2-x)/o,my=(V/2-y)/o;sc=ns;x=V/2-mx*ns;y=V/2-my*ns;draw()});
  Q("#mNo").onclick=closeModal;
  Q("#mYes").onclick=()=>{const c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,-x/sc,-y/sc,V/sc,V/sc,0,0,160,160);closeModal();photoSave(c.toDataURL("image/jpeg",.76))}}
